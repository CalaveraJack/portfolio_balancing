[project]
name = "index-creator"
version = "0.3.0"
description = "Minimal index creator for backtesting and research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=1.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "plotly",
    "streamlit>=1.36",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Package with all engine and UI code: index_lib/*
[tool.setuptools.packages.find]
where = ["."]
include = ["index_lib*"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=8.4.2",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# The codebase targets 3.9 and uses typing.Optional/List throughout; the
# pyupgrade rules are deliberately left off so annotations stay consistent.
select = ["E", "F", "I", "W"]
