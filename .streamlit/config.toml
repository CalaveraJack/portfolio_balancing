[theme]
base = "dark"
primaryColor = "#e3a33b"
backgroundColor = "#0c0a07"
secondaryBackgroundColor = "#1d1911"
textColor = "#efe5cf"
font = "sans serif"
# Square corners everywhere: Streamlit widgets, data tables, buttons.
baseRadius = "none"
borderColor = "#3a3020"

[server]
headless = true

[browser]
gatherUsageStats = false
